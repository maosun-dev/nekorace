# iPhone版を組み立てて、TestFlightに送る。
# 1) このパソコンの Unity で Xcode プロジェクトを作り、zip にして GitHub のリリースに置く
#    （unity build NekoRace --target iOS --execute-method NekoRace.EditorTools.IOSBuild.Build -o <出力先>/iOS
#      → <出力先> で `iOS` フォルダーを zip にして gh release create ios-xcode-<番号> で上げる）
# 2) この手順で、GitHub の Mac がそれを取ってきて組み立て、TestFlight に送る。
# GitHubのリポジトリの「Actions」タブ →「iPhone版をTestFlightへ」→「Run workflow」で、リリースの名前を入れて動かす。
# Unity の鍵は GitHub に置かない（Unity の作業はこのパソコンでする）。
#
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   APPLE_TEAM_ID              Appleのチーム ID（10文字）
#   APPSTORE_API_KEY_ID        App Store Connect API キーの Key ID
#   APPSTORE_API_ISSUER_ID     App Store Connect API キーの Issuer ID
#   APPSTORE_API_PRIVATE_KEY   ダウンロードした AuthKey_XXXX.p8 の中身（全文）
name: iPhone版をTestFlightへ

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Xcode プロジェクトの zip を置いたリリースの名前（例：ios-xcode-1）'
        required: true
      runner:
        description: '組み立てに使う Mac（新しいチップの Mac は混んでいて始まらないことがある）'
        type: choice
        options: [macos-15-intel, macos-latest]
        default: macos-15-intel

permissions:
  contents: read

jobs:
  testflight:
    name: Mac で組み立てて TestFlight に送る
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 90
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
    steps:
      - name: Xcode プロジェクトを取ってくる
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          mkdir -p build/iOS
          gh release download "$RELEASE" --repo "${{ github.repository }}" --pattern '*.zip' --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP"/*.zip -d build/iOS
          ls build/iOS/iOS | head

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: App Store Connect の鍵を置く
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      # Unity が書く Info.plist は CFBundleVersion が PlayerSettings の Build（0）のままなので、
      # 実行の番号で毎回ちがう版番号にする（同じコミットで再実行しても「使用済み」で弾かれない）。
      # あわせて「暗号化は標準のものだけ」と書き、TestFlight で輸出コンプライアンスの質問が出ないようにする。言語も日本語にする
      - name: 版番号と輸出コンプライアンスを書き込む
        run: |
          PLIST=build/iOS/iOS/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ github.run_number }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          # 日本語だけのアプリなので、App Store の「言語」欄が EN にならないよう日本語にする
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion ja" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string ja" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleLocalizations" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string ja" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"

      # ここでは署名しない（署名すると開発用の証明書が要り、それには iPhone の登録が要る）。
      # 配布用の署名は次の「TestFlight に送る」で付ける。
      - name: アプリを組み立てる（archive）
        run: |
          # 成果物の受け渡しで実行の印が外れることがあるので付け直す
          find build/iOS -name '*.sh' -exec chmod +x {} \;
          xcodebuild archive \
            -project build/iOS/iOS/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}   # UnityFramework 側の版番号。本体は前の段で書いた Info.plist の値
          # アプリの名前に依らず .app を探す
          APP=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          # 署名なしの部品は送るときに署名し直されないので、仮の署名を付けておく（送るときに配布用に置き換わる）
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 -name '*.framework' \
              -exec codesign --force --sign - --timestamp=none {} \;
          fi
          codesign --force --sign - --timestamp=none "$APP"

      - name: TestFlight に送る
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: 鍵を消す
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
